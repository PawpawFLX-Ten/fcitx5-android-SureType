# Rime schema for Suretype 14-key keyboard
# Uses built-in luna_pinyin dictionary with xlit-based disambiguation.
# encoding: utf-8

schema:
  schema_id: suretype_14key
  name: 双键十四键
  version: "2026-05-09"
  author:
    - WhiteFrost
  description: |
    Suretype 14-key dual-key layout with xlit disambiguation.
    Uses luna_pinyin dictionary. Each physical key represents two adjacent
    QWERTY letters; the xlit algebra rule maps them to a canonical position
    and the prism handles reverse-index disambiguation.
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " '"
  algebra:
    # 14-key disambiguation: compress 26 letters to 14 canonical positions
    # Canonical keys (primary letter of each Suretype key):
    #   QW→q  ER→e  TY→t  UI→u  OP→o
    #   AS→a  DF→d  GH→g  JK→j  L →l
    #   ZX→z  CV→c  BN→b  M →m
    - xlit/qwertyuiopasdfghjklzxcvbnm/qqeettuuooaaddggjjlzzccbbm/
    - xlit/QWERTYUIOPASDFGHJKLZXCVBNM/QQEETTUUOOAADDGGJJLZZCCBBM/

translator:
  dictionary: luna_pinyin
  prism: suretype_14key
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

key_binder:
  import_preset: default

recognizer:
  import_preset: default
